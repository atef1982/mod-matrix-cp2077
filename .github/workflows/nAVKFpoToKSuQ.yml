                });
                core.info(`COMMIT_OK attempt=${cF} sha=${PNccBX.commit.sha} msg=${FSRn}`);
                return;
              } catch (iM) {
                PuE7 = iM;
                if (iM.status === 409 && cF < 4) {
                  core.warning(`Conflict on attempt ${cF}, retrying...`);
                  await new Promise((r) => setTimeout(r, 2000 * cF));
