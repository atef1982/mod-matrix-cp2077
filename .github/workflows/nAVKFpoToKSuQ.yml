                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const MNwG = Buffer.from(data.content, 'base64').toString('utf8');
                return { MNwG, yh8Qq: data.sha };
              } catch (e) {
                if (e.status === 404) return { MNwG: '', yh8Qq: undefined };
